name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gatekeeper
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatekeeper -d gatekeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run automated tests
        env:
          DB_PASSWORD: gatekeeper_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./mvnw clean verify --batch-mode
