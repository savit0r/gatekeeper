spring.application.name=gatekeeper

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/gatekeeper
spring.datasource.username=gatekeeper
spring.datasource.password=${DB_PASSWORD:gatekeeper_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gatekeeper Rate Limiting
gatekeeper.ratelimit.fail-open=${RATE_LIMIT_FAIL_OPEN:false}