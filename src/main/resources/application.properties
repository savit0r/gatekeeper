spring.application.name=gatekeeper

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/gatekeeper
spring.datasource.username=gatekeeper
spring.datasource.password=${DB_PASSWORD:gatekeeper_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gatekeeper Rate Limiting
gatekeeper.ratelimit.fail-open=${RATE_LIMIT_FAIL_OPEN:false}

# Gatekeeper Key Cache
gatekeeper.cache.api-key-ttl-seconds=${API_KEY_CACHE_TTL_SECONDS:600}

# Developer JWT Authentication
gatekeeper.jwt.secret=${JWT_SECRET:gatekeeper-super-secret-developer-jwt-signing-key-minimum-256-bits!}
gatekeeper.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true