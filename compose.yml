services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatekeeper:latest
    container_name: gatekeeper-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gatekeeper
      SPRING_DATASOURCE_USERNAME: gatekeeper
      DB_PASSWORD: ${POSTGRES_PASSWORD:-gatekeeper_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-gatekeeper-super-secret-developer-jwt-signing-key-minimum-256-bits!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: gatekeeper-postgres
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatekeeper_dev}
    ports:
      - "5432:5432"
    volumes:
      - gatekeeper_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gatekeeper-redis
    ports:
      - "6379:6379"
    volumes:
      - gatekeeper_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gatekeeper_data:
  gatekeeper_redis_data:
